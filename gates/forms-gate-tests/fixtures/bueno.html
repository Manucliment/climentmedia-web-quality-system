<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Formulario correcto | Fixture del paso 10</title>
<style>
  body { font: 16px/1.5 system-ui; margin: 2rem; }
  .cita label { display: block; font-weight: 600; margin-top: .9rem; }
  .cita input, .cita textarea { display: block; width: 100%; max-width: 40rem; padding: .6rem; }
  .cita button { margin-top: 1rem; padding: .7rem 1.4rem; font: inherit; }
  /* EL CEPO: fuera de pantalla, NO con display:none. Hay bots que ignoran los
     campos ocultos con display, y entonces el cepo deja de cazar. Esconde el
     campo Y su etiqueta -- en site-d la etiqueta era lo que se veia. */
  .cita__trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .cita__consent { display: flex; gap: .5rem; align-items: flex-start; margin-top: 1rem; }
  .cita__consent input { width: auto; }
</style>
</head>
<body>
<!-- CASO VERDE, y es el ARREGLO del rojo, no otro fichero: mismo formulario con
     el cepo escondido, action real, todos los campos etiquetados, consentimiento
     que ENLAZA la politica, y un boton de envio de verdad. -->
<main>
  <h1>Pide tu cita</h1>
  <form class="cita" action="/contacto.php" method="post" data-guarda-doble="si">
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" type="text" required>

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required>

    <label for="tel">Telefono</label>
    <input id="tel" name="tel" type="tel">

    <div class="cita__trap">
      <label for="website">No rellenar</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje"></textarea>

    <label class="cita__consent">
      <input type="checkbox" name="consent" required>
      <span>He leido y acepto la <a href="/politica-privacidad/">politica de privacidad</a>.</span>
    </label>

    <button type="submit">Enviar solicitud</button>
  </form>
</main>
</body>
</html>
