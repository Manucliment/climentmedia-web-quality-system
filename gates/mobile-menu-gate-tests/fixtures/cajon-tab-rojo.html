<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="_menu.css"><title>cajon-tab-rojo</title></head><body>
<!-- Cajon lateral movido fuera de pantalla con transform: cerrado, sus seis enlaces siguen en el orden de Tab. FALLA N5. -->
<header><a href="/">Marca</a><button class="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button></header><nav id="menu" style="position:fixed;top:0;right:0;width:280px;height:100vh;transform:translateX(100%)"><a href="/servicios/">Servicios</a><a href="/precios/">Precios</a><a href="/equipo/">Equipo</a><a href="/galeria/">Galeria</a><a href="/opiniones/">Opiniones</a><a href="/contacto/">Contacto</a></nav>
<main><h1>Barberia de barrio</h1><p>Cortes de pelo y arreglo de barba con cita previa, de martes a sabado. Esta pagina existe para que el gate tenga una pagina que juzgar: mas de doscientos caracteres de texto y un titular, como cualquier pagina de verdad.</p></main>
<script>const b=document.querySelector(".menu-btn"),m=document.getElementById("menu");b.addEventListener("click",()=>{const o=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!o));m.style.transform=o?"translateX(100%)":"none";});</script></body></html>
