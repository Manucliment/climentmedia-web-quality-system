<!-- 🔴 LA FORMA EXACTA DE site-b.example, 24-ago-2026. El dominio lo sirven DOS
     webs: nuestro arbol estatico y un WordPress. Las fichas declaran 330
     imagenes bajo `/wp-content/uploads/`, que jamas estaran en el arbol que
     desplegamos —las sirve el otro backend— y que en PRODUCCION responden las
     330 con 200 (medido).
     El candidato sirve SOLO el arbol, asi que ahi dan 404 por construccion.
     REN-13 las acusaba y dejaba el veredicto en FALLA: un despliegue bloqueado
     por algo que no esta roto.
     El discriminador correcto no es «existe el fichero» sino DE QUIEN ES LA
     ZONA: `/css/` esta en el arbol -> la servimos nosotros -> un 404 ahi es
     nuestro. `/wp-content/` no esta -> la sirve otro -> aqui no hay pregunta
     que hacer, la contesta produccion. -->
<body>
<main>
  <section><h1>Dos backends bajo un dominio</h1>
    <p>Esta pagina la sirve el arbol estatico. La foto de abajo la sirve el WordPress del mismo dominio.</p>
    <img src="/wp-content/uploads/2024/08/foto-del-otro-backend.jpg" alt="Foto servida por el otro backend" width="600" height="600">
  </section>
</main>
