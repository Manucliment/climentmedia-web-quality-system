       distingue un indice de un menu. Faltaba aqui porque faltaba en la tabla del
       gate, que llevaba tres roles desde que se escribio. Ahora la tabla es una
       sola y vive en references/anatomia.tsv. -->
  <section data-sec="calificacion"><h2>Cual te sirve</h2><p>Si vendes por llamada, el primero.</p></section>
