<!DOCTYPE html>

<head>

<title>PLANTILLA — 404</title>
<!--
  GENERADO POR gates/roles.pl --plantillas. NO SE EDITA A MANO.
  Lo que se edita es la FUENTE: el orden de los roles esta en
  gates/anatomy.tsv y el molde de cada rol en gates/roles.tsv.
  `roles.pl --gate` se pone rojo si este fichero deja de ser el que
  saldria hoy, asi que editarlo a mano no dura una bateria.

  NO LLEVA EL MARKUP DE LOS MOLDES DENTRO, a proposito: seria una
  segunda copia de cada uno, y el dia que se arregle un molde esta
  hoja seguiria ensenando el defecto. Apunta, no copia.
-->
<link rel="stylesheet" href="../_tokens.css">
<link rel="stylesheet" href="../_base.css">
<style>
  :root{--pl-bg:#fff;--pl-fg:#16181d;--pl-dim:#5a6472;--pl-line:#c9d0d8;--pl-link:#0b5fff}
  @media (prefers-color-scheme:dark){:root{--pl-bg:#14161a;--pl-fg:#e8ebef;--pl-dim:#a4adba;--pl-line:#3a424e;--pl-link:#7fb0ff}}
  html{background:var(--pl-bg)}
  body{background:var(--pl-bg);color:var(--pl-fg);
       font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
       max-width:70ch;margin:0 auto;padding:2rem 1rem}
  a{color:var(--pl-link)}
  .slot{border:1px solid var(--pl-line);border-radius:.4rem;padding:.9rem 1rem;margin:.9rem 0}
  .slot--cond{border-style:dashed}
  .slot--mano{border-style:dotted}
  .n{font-variant-numeric:tabular-nums;color:var(--pl-dim)}
  .rol{font-weight:700}
  .job{margin:.2rem 0 .5rem}
  .meta{font-size:.9em;color:var(--pl-dim);margin:.15rem 0}
  ol{list-style:none;padding:0}
  code{font-size:.95em}
</style>
</head>
<body>
<h1>Plantilla de referencia — <code>404</code></h1>

</body>
